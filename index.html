<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Text Classification System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>Text Classification System</h1>

        <p class="subtitle">
            Classify a message as Spam or Normal.
        </p>


        <form method="POST">

            <textarea
                name="text"
                placeholder="Enter a message..."
                required
            >{{ text }}</textarea>

            <button type="submit">
                Classify Text
            </button>

        </form>


        {% if prediction %}

        <div class="result">

            <h2>Classification Result</h2>

            <div class="prediction">
                {{ prediction }}
            </div>

            <p>
                Confidence: <strong>{{ confidence }}%</strong>
            </p>

        </div>

        {% endif %}

    </div>

</body>

</html>
